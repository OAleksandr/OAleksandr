name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E87722&color_dots=#ebedf0,#ffd8b5,#ffb470,#f58f3a,#e87722
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E87722&color_dots=#161b22,#5c2f0c,#8f4a14,#c2621c,#e87722

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
